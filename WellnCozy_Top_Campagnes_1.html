<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WellnCozy — Top Campagnes PPC</title>
<style>
:root{
  --bg:#0f172a; --s1:#1e293b; --s2:#334155; --bd:#475569;
  --tx:#f1f5f9; --mu:#94a3b8;
  --gr:#10B981; --rd:#EF4444; --am:#F59E0B; --bl:#3B82F6;
}
*{box-sizing:border-box;}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--tx); font-size:16px; line-height:1.4;}
.wrap{max-width:1200px; margin:0 auto; padding:20px 24px 60px;}
header h1{font-size:24px; margin:0 0 4px;}
header .sub{color:var(--mu); font-size:13px;}
.card{background:var(--s1); border:1px solid var(--bd); border-radius:12px; padding:18px 20px; margin:18px 0;}
.card h3{margin:0 0 12px; font-size:15px;}
.filters{display:flex; flex-wrap:wrap; gap:20px; align-items:flex-end;}
.filt-group label{display:block; font-size:11px; color:var(--mu); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px;}
input[type=date]{background:var(--s2); border:1px solid var(--bd); color:var(--tx); border-radius:6px; padding:6px 8px; font-size:14px; font-family:inherit;}
.quick{display:flex; gap:8px;}
.quick button, .btn{background:var(--s2); color:var(--tx); border:1px solid var(--bd); border-radius:6px; padding:7px 14px; font-size:13px; cursor:pointer; font-family:inherit;}
.quick button:hover, .btn:hover{border-color:var(--bl);}
.quick button.active{background:var(--bl); border-color:var(--bl); color:#fff;}
#tableWrap{overflow-x:auto; border-radius:8px;}
table{width:auto; min-width:100%; border-collapse:collapse; font-size:14px; table-layout:fixed;}
th,td{padding:9px 10px; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
th{font-size:11px; color:var(--mu); text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--bd); cursor:pointer; user-select:none; position:relative;}
th:hover{color:var(--tx);}
th.sorted{color:var(--bl);}
th .arrow{font-size:10px; margin-left:3px; opacity:.7;}
th:first-child, td:first-child{text-align:left;}
th .col-resizer{position:absolute; right:0; top:0; bottom:0; width:8px; cursor:col-resize; user-select:none; z-index:2;}
th .col-resizer:hover, th .col-resizer.resizing{background:var(--bl);}
tbody tr{border-bottom:1px solid rgba(71,85,105,.35);}
tbody tr:hover{background:rgba(59,130,246,.06);}
tr.grandtotal{background:rgba(245,158,11,.12); font-weight:700; border-top:2px solid var(--am);}
tr.grandtotal:hover{background:rgba(245,158,11,.12);}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:13px;}
.badge .sw{width:9px; height:9px; border-radius:3px; display:inline-block;}
.tag{font-size:11px; padding:2px 7px; border-radius:10px; font-weight:600;}
.tag.sp{background:rgba(59,130,246,.15); color:#3B82F6;}
.tag.sb{background:rgba(245,158,11,.15); color:#F59E0B;}
.neg{color:var(--rd);}
.pos{color:var(--gr);}
.campaign-name{max-width:340px; overflow:hidden; text-overflow:ellipsis; font-size:12.5px; color:var(--mu);}
#subtitle{color:var(--mu); font-size:12.5px; margin-bottom:14px;}
.empty-msg{color:var(--mu); font-size:13px; text-align:center; padding:30px 0;}
footer{text-align:center; color:var(--mu); font-size:12px; margin-top:24px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎯 WellnCozy — Top Campagnes PPC</h1>
    <div class="sub">Classement des campagnes par performance, sur la période sélectionnée</div>
  </header>

  <div class="card">
    <div class="filters">
      <div class="filt-group">
        <label>Date début</label>
        <input type="date" id="d1">
      </div>
      <div class="filt-group">
        <label>Date fin</label>
        <input type="date" id="d2">
      </div>
      <div class="filt-group">
        <label>Raccourcis</label>
        <div class="quick">
          <button data-yesterday="1">Hier</button>
          <button data-n="7">7 jours</button>
          <button data-n="30">30 jours</button>
          <button data-all="1">Tout l'historique</button>
        </div>
      </div>
      <div class="filt-group">
        <button class="btn" id="applyBtn">Appliquer</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Top 10 campagnes</h3>
    <div id="subtitle"></div>
    <div id="tableWrap"></div>
  </div>

  <footer>WellnCozy · Top Campagnes PPC · Généré par Claude</footer>
</div>

\"", "campaignName": "WC | WC-COPDSKx1 | B0FZWZR6ZT | US | SPV | PDP | Competitors x1 | Exact", "asin": "B0FZWZR6ZT", "ad_type": "Sponsored Products", "impressions": 3, "clicks": 0, "purchases": 0, "units": 0, "sales": 0.0, "cost": 0.0}]};

const COLUMNS = [
  {key: 'campaignName',label: 'Campagne',         type: 'text'},
  {key: 'impressions', label: 'Impressions',      type: 'int'},
  {key: 'clicks',      label: 'Clics',            type: 'int'},
  {key: 'ctr',         label: 'CTR',              type: 'pct'},
  {key: 'units',       label: 'Units',            type: 'int'},
  {key: 'cvr',         label: 'CVR',              type: 'pct'},
  {key: 'sales',       label: 'Revenu',           type: 'money0'},
  {key: 'cost',        label: 'Coût PPC',         type: 'money0'},
  {key: 'acos',        label: 'ACOS',             type: 'pct0'},
  {key: 'roas',        label: 'ROAS',             type: 'ratio'},
];

let sortKey = 'units';
let sortDir = 'desc';
// Initial column widths (px); persists (and is updated by) user drag-resizing across re-renders (sort/filter)
let colWidths = {
  campaignName: 320, impressions: 110, clicks: 90, ctr: 80,
  units: 100, cvr: 80, sales: 110, cost: 100, acos: 90, roas: 90,
};

function totalTableWidth(){
  return COLUMNS.reduce((sum, c) => sum + (colWidths[c.key] || 100), 0);
}

function fmtInt(n){ return Math.round(n).toLocaleString('fr-FR'); }
function fmt$(n){ return '$' + n.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmt$0(n){ return '$' + Math.round(n).toLocaleString('fr-FR'); }
function fmtPct(n){ return isFinite(n) ? n.toFixed(1) + '%' : '—'; }
function fmtPct0(n){ return isFinite(n) ? Math.round(n) + '%' : '—'; }
function fmtRatio(n){ return isFinite(n) ? n.toFixed(2) + 'x' : '—'; }

function fmtCell(col, row){
  const v = row[col.key];
  switch(col.type){
    case 'text': return v;
    case 'int': return fmtInt(v);
    case 'money': return fmt$(v);
    case 'money0': return fmt$0(v);
    case 'pct': return fmtPct(v);
    case 'pct0': return fmtPct0(v);
    case 'ratio': return fmtRatio(v);
  }
  return v;
}

function aggregate(d1, d2){
  const filtered = DATA.rows.filter(r => r.date >= d1 && r.date <= d2);
  const byCampaign = {};
  filtered.forEach(r => {
    const key = r.campaignId;
    if (!byCampaign[key]){
      byCampaign[key] = {
        campaignId: r.campaignId, campaignName: r.campaignName, asin: r.asin, adType: r.ad_type,
        impressions: 0, clicks: 0, purchases: 0, units: 0, sales: 0, cost: 0,
      };
    }
    const c = byCampaign[key];
    c.impressions += r.impressions;
    c.clicks += r.clicks;
    c.purchases += r.purchases;
    c.units += r.units;
    c.sales += r.sales;
    c.cost += r.cost;
  });
  return Object.values(byCampaign).map(c => {
    c.product = DATA.asinNames[c.asin] || c.asin;
    c.ctr = c.impressions > 0 ? (c.clicks / c.impressions * 100) : 0;
    c.cvr = c.clicks > 0 ? (c.purchases / c.clicks * 100) : 0;
    c.acos = c.sales > 0 ? (c.cost / c.sales * 100) : (c.cost > 0 ? Infinity : 0);
    c.roas = c.cost > 0 ? (c.sales / c.cost) : (c.sales > 0 ? Infinity : 0);
    return c;
  });
}

function render(){
  const d1 = document.getElementById('d1').value;
  const d2 = document.getElementById('d2').value;
  const rows = aggregate(d1, d2);

  rows.sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    av = isFinite(av) ? av : (sortDir === 'desc' ? -Infinity : Infinity);
    bv = isFinite(bv) ? bv : (sortDir === 'desc' ? -Infinity : Infinity);
    return sortDir === 'asc' ? av - bv : bv - av;
  });

  const top10 = rows.slice(0, 10);
  const subEl = document.getElementById('subtitle');
  subEl.textContent = `Période : ${d1} → ${d2} · ${rows.length} campagne(s) actives · triées par ${COLUMNS.find(c=>c.key===sortKey).label} (${sortDir === 'desc' ? 'décroissant' : 'croissant'})`;

  const wrap = document.getElementById('tableWrap');
  if (!top10.length){
    wrap.innerHTML = '<div class="empty-msg">Aucune donnée sur cette période.</div>';
    return;
  }

  let html = '<table><colgroup>';
  COLUMNS.forEach(col => {
    html += `<col style="${colWidths[col.key] ? 'width:' + colWidths[col.key] + 'px' : ''}">`;
  });
  html += '</colgroup><thead><tr>';
  COLUMNS.forEach(col => {
    const isSorted = col.key === sortKey;
    const arrow = isSorted ? (sortDir === 'desc' ? '▾' : '▴') : '';
    html += `<th class="${isSorted?'sorted':''}" data-key="${col.key}">${col.label}<span class="arrow">${arrow}</span><span class="col-resizer" data-resize-key="${col.key}"></span></th>`;
  });
  html += '</tr></thead><tbody>';
  top10.forEach(r => {
    html += '<tr>';
    COLUMNS.forEach(col => {
      let cls = '';
      if (col.key === 'campaignName') cls = 'campaign-name';
      if (col.key === 'acos' && isFinite(r.acos)) {
        cls = r.acos > 100 ? 'neg' : (r.acos < 30 ? 'pos' : '');
      }
      html += `<td class="${cls}" title="${col.key==='campaignName' ? r.campaignName : ''}">${fmtCell(col, r)}</td>`;
    });
    html += '</tr>';
  });

  // Total row: raw counts summed across the displayed top 10 rows, then
  // ratios re-derived from those sums (not averaged per-row) -- same
  // Simpson's-paradox-avoidance pattern used throughout this report.
  const tot = top10.reduce((a, r) => {
    a.impressions += r.impressions; a.clicks += r.clicks; a.purchases += r.purchases;
    a.units += r.units; a.sales += r.sales; a.cost += r.cost;
    return a;
  }, {impressions:0, clicks:0, purchases:0, units:0, sales:0, cost:0});
  tot.ctr = tot.impressions > 0 ? (tot.clicks / tot.impressions * 100) : 0;
  tot.cvr = tot.clicks > 0 ? (tot.purchases / tot.clicks * 100) : 0;
  tot.acos = tot.sales > 0 ? (tot.cost / tot.sales * 100) : (tot.cost > 0 ? Infinity : 0);
  tot.roas = tot.cost > 0 ? (tot.sales / tot.cost) : (tot.sales > 0 ? Infinity : 0);

  html += '<tr class="grandtotal">';
  COLUMNS.forEach(col => {
    if (col.key === 'campaignName') { html += `<td>TOTAL (Top ${top10.length})</td>`; return; }
    let cls = '';
    if (col.key === 'acos' && isFinite(tot.acos)) cls = tot.acos > 100 ? 'neg' : (tot.acos < 30 ? 'pos' : '');
    html += `<td class="${cls}">${fmtCell(col, tot)}</td>`;
  });
  html += '</tr>';

  html += '</tbody></table>';
  wrap.innerHTML = html;

  // Chromium's table-layout:fixed + width:auto fills the container but never
  // grows past it, even with large explicit <col> widths -- so the table
  // would silently clip/ignore wide columns instead of the wrap scrolling.
  // Setting the table's own width to the sum of column widths makes it grow
  // beyond #tableWrap when needed; #tableWrap's overflow-x:auto then scrolls
  // internally, keeping the card's border (the visible "contour") fixed.
  wrap.querySelector('table').style.width = totalTableWidth() + 'px';

  document.querySelectorAll('th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortKey === key){
        sortDir = sortDir === 'desc' ? 'asc' : 'desc';
      } else {
        sortKey = key;
        sortDir = 'desc';
      }
      render();
    });
  });

  // Resizable columns: dragging a handle resizes the whole column via its
  // <col> element (table-layout:fixed), and the width is stashed in
  // colWidths so it survives re-renders triggered by sorting/filtering.
  document.querySelectorAll('.col-resizer').forEach(handle => {
    handle.addEventListener('click', e => e.stopPropagation());
    handle.addEventListener('mousedown', e => {
      e.stopPropagation();
      e.preventDefault();
      const key = handle.dataset.resizeKey;
      const th = handle.closest('th');
      const colIndex = Array.from(th.parentNode.children).indexOf(th);
      const colEl = wrap.querySelectorAll('col')[colIndex];
      const startX = e.pageX;
      const startWidth = th.getBoundingClientRect().width;
      handle.classList.add('resizing');
      function onMove(e2){
        const w = Math.max(50, Math.round(startWidth + (e2.pageX - startX)));
        colWidths[key] = w;
        if (colEl) colEl.style.width = w + 'px';
        const table = wrap.querySelector('table');
        if (table) table.style.width = totalTableWidth() + 'px';
      }
      function onUp(){
        handle.classList.remove('resizing');
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

function addDays(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

function initFilters(){
  document.getElementById('d1').value = DATA.meta.dateMin;
  document.getElementById('d2').value = DATA.meta.dateMax;
  document.getElementById('d1').min = DATA.meta.dateMin;
  document.getElementById('d1').max = DATA.meta.dateMax;
  document.getElementById('d2').min = DATA.meta.dateMin;
  document.getElementById('d2').max = DATA.meta.dateMax;

  document.getElementById('applyBtn').addEventListener('click', render);

  document.querySelectorAll('.quick button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.quick button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (btn.dataset.all){
        document.getElementById('d1').value = DATA.meta.dateMin;
        document.getElementById('d2').value = DATA.meta.dateMax;
      } else if (btn.dataset.yesterday){
        const y = addDays(DATA.meta.dateMax, -1);
        const clamped = y < DATA.meta.dateMin ? DATA.meta.dateMin : y;
        document.getElementById('d1').value = clamped;
        document.getElementById('d2').value = clamped;
      } else {
        // Full-day windows ending yesterday -- today is still incomplete
        // (PPC attribution keeps updating for ~24-48h), so "7 jours" /
        // "30 jours" mean the 7 or 30 full days before today, not
        // including today's partial numbers.
        const n = parseInt(btn.dataset.n, 10);
        const end = addDays(DATA.meta.dateMax, -1);
        document.getElementById('d2').value = end < DATA.meta.dateMin ? DATA.meta.dateMin : end;
        const start = addDays(DATA.meta.dateMax, -n);
        document.getElementById('d1').value = start < DATA.meta.dateMin ? DATA.meta.dateMin : start;
      }
      render();
    });
  });

  // Default view: last 30 days
  document.querySelector('.quick button[data-n="30"]').click();
}

initFilters();
</script>
</body>
</html>
